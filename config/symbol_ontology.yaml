# ---------------------------------------------------------------------------
# Symbol ontology for Dataset-P&ID (32 classes)
#
# Keys are PIDQA class ids (1..32).  YOLO label ids are these MINUS ONE.
#
# The dataset ships no class names, so `name` here was derived by cropping real
# instances of every class and reading them against ISA-5.1 P&ID convention
# (see scratch/atlas/*.png, generated by scripts/symbol_atlas.py).
#
# `confidence` records how sure that reading is:
#   high   - unambiguous ISA symbol, or the tag text is printed inside the symbol
#   medium - clear geometry, plausible ISA reading, worth a second opinion
#   low    - geometry recorded faithfully, naming is a best guess -> PLEASE VERIFY
#
# IMPORTANT: names never affect benchmark correctness. PIDQA questions reference
# classes by NUMBER, so evaluation is valid regardless. Names only affect how
# readable the generated answers are. Edit freely.
#
# `tag_location` drives entity resolution and matters a great deal:
#   internal - tag text is printed INSIDE the symbol bbox (instrument bubbles)
#   external - tag floats near the symbol, needs nearest-neighbour matching
#   none     - this symbol is not normally tagged
# ---------------------------------------------------------------------------

classes:
  1:  {name: "gate valve, crossed",        category: valve,      tag_location: external, confidence: low,    geometry: "bowtie body with cross overlay and stem"}
  2:  {name: "plug valve",                 category: valve,      tag_location: external, confidence: medium, geometry: "bowtie body with circled X at centre"}
  3:  {name: "globe valve",                category: valve,      tag_location: external, confidence: high,   geometry: "bowtie body with filled circle at centre"}
  4:  {name: "gate valve",                 category: valve,      tag_location: external, confidence: high,   geometry: "plain bowtie body"}
  5:  {name: "ball valve",                 category: valve,      tag_location: external, confidence: high,   geometry: "bowtie body with open circle at centre"}
  6:  {name: "angle globe valve",          category: valve,      tag_location: external, confidence: medium, geometry: "offset/angled body with filled circle"}
  7:  {name: "lever-operated plug valve",  category: valve,      tag_location: external, confidence: low,    geometry: "bowtie body with lever handle overlay"}
  8:  {name: "check valve",                category: valve,      tag_location: external, confidence: medium, geometry: "single triangle inline"}
  9:  {name: "butterfly valve",            category: valve,      tag_location: external, confidence: medium, geometry: "lens/oval body with X"}
  10: {name: "three-way valve",            category: valve,      tag_location: external, confidence: medium, geometry: "bowtie with filled third port"}
  11: {name: "check valve, directional",   category: valve,      tag_location: external, confidence: medium, geometry: "bowtie with one half filled"}
  12: {name: "gate valve, closed",         category: valve,      tag_location: external, confidence: low,    geometry: "fully filled bowtie"}
  13: {name: "globe valve, closed",        category: valve,      tag_location: external, confidence: low,    geometry: "filled bowtie with bulged waist"}
  14: {name: "diaphragm valve",            category: valve,      tag_location: external, confidence: high,   geometry: "bowtie with half-dome actuator"}
  15: {name: "sight glass",                category: fitting,    tag_location: external, confidence: low,    geometry: "open circle inline with pipe"}
  16: {name: "inline indicator",           category: fitting,    tag_location: external, confidence: low,    geometry: "filled circle inline with pipe"}
  17: {name: "actuated valve, single",     category: actuator,   tag_location: external, confidence: low,    geometry: "circle on stem above capacitor-style plates"}
  18: {name: "actuated valve, double",     category: actuator,   tag_location: external, confidence: low,    geometry: "filled+open circle pair with plates"}
  19: {name: "actuated valve, offset",     category: actuator,   tag_location: external, confidence: low,    geometry: "filled/open circle pair, offset stem"}
  20: {name: "reducer",                    category: fitting,    tag_location: none,     confidence: high,   geometry: "trapezoid inline with pipe"}
  21: {name: "flange / pipe connection",   category: fitting,    tag_location: none,     confidence: medium, geometry: "paired parallel bars across the pipe"}
  22: {name: "static mixer",               category: equipment,  tag_location: external, confidence: low,    geometry: "rectangle enclosing a zigzag element"}
  23: {name: "insulation marking",         category: annotation, tag_location: external, confidence: high,   geometry: "cylinder with dashed centreline; nearby tag reads INS ( NN degC )"}
  24: {name: "flow direction arrow",       category: annotation, tag_location: none,     confidence: medium, geometry: "solid filled triangle"}
  25: {name: "relief valve",               category: instrument, tag_location: external, confidence: medium, geometry: "circle with inscribed X; nearby tags read (P)RV-*"}
  26: {name: "instrument, GR series",      category: instrument, tag_location: internal, confidence: high,   geometry: "bubble; internal tag GRI/GRO/GRP + 3 digits"}
  27: {name: "restriction orifice RO-10",  category: instrument, tag_location: internal, confidence: high,   geometry: "bubble; internal tag 'RO-10' + 3 digits"}
  28: {name: "instrument SDL, field",      category: instrument, tag_location: internal, confidence: high,   geometry: "bubble, single horizontal bar; tag SDL + 3 digits"}
  29: {name: "instrument DDL, shared",     category: instrument, tag_location: internal, confidence: high,   geometry: "bubble, double horizontal bar; tag DDL + 3 digits"}
  30: {name: "station STA",                category: instrument, tag_location: internal, confidence: high,   geometry: "square; internal tag 'STA'"}
  31: {name: "position switch ZLO/ZLC",    category: instrument, tag_location: internal, confidence: high,   geometry: "square+circle; internal tag ZLO/ZLC + 3 digits"}
  32: {name: "level gauge LG-10",          category: instrument, tag_location: internal, confidence: high,   geometry: "square; three internal lines, middle reads 'LG-10'"}

# Tag prefixes observed in the corpus - used to validate/repair OCR output.
tag_prefixes:
  26: [GRI, GRO, GRP, GI]
  27: [RO-10]
  28: [SDL]
  29: [DDL]
  30: [STA]
  31: [ZLO, ZLC]
  32: [LG-10]
  25: [ERV, LRV, PRV, RV, V]
  23: [INS]
