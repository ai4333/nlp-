<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    :root{
      --bg:#05070a; --s1:#0a0e14; --s2:#0e141c; --s3:#141c26;
      --ln:rgba(125,205,255,.13); --ln2:rgba(125,205,255,.26);
      --tx:#dbe7f0; --tx2:#7d94a8; --tx3:#4d6072;
      --cy:oklch(.82 .13 210); --am:oklch(.82 .13 75);
      --gn:oklch(.82 .13 155); --rd:oklch(.72 .15 25);
      --mono:'IBM Plex Mono',ui-monospace,monospace;
      --ui:'Space Grotesk',system-ui,sans-serif;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ui);}
    a{color:var(--cy);text-decoration:none;} a:hover{color:#9fe9ff;}
    .grid-bg{position:absolute;inset:0;pointer-events:none;
      background-image:linear-gradient(rgba(125,205,255,.028) 1px,transparent 1px),
                       linear-gradient(90deg,rgba(125,205,255,.028) 1px,transparent 1px);
      background-size:52px 52px;}
    .brk{position:relative;}
    .brk::before,.brk::after{content:'';position:absolute;width:9px;height:9px;
      border-color:var(--ln2);border-style:solid;pointer-events:none;}
    .brk::before{left:-1px;top:-1px;border-width:1px 0 0 1px;}
    .brk::after{right:-1px;bottom:-1px;border-width:0 1px 1px 0;}
    .mono{font-family:var(--mono);}
    .lbl{font:600 9px var(--ui);letter-spacing:.19em;text-transform:uppercase;color:var(--tx3);}
  </style>
</helmet>

<div style="width:1440px;height:900px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column">
  <div class="grid-bg"></div>
  <div style="display:flex;align-items:center;gap:16px;padding:0 22px;height:52px;border-bottom:1px solid var(--ln);background:rgba(10,14,20,.86);z-index:2;flex:none">
    <span class="lbl" style="font-size:10px;color:var(--cy)">KNOWLEDGE GRAPH</span>
    <div style="width:1px;height:22px;background:var(--ln)"></div>
    <span class="mono" style="font-size:11px;color:var(--tx2)">1 963 nodes · 2 049 links · 495 control loops · 304 flow</span>
    <div style="flex:1"></div>
    <div style="display:flex;gap:6px">
      <div style="padding:5px 12px;border:1px solid var(--cy);background:rgba(77,216,240,.1)"><span class="mono" style="font-size:10px;color:var(--cy)">NATURAL LANGUAGE</span></div>
      <div style="padding:5px 12px;border:1px solid var(--ln)"><span class="mono" style="font-size:10px;color:var(--tx3)">CYPHER</span></div>
    </div>
  </div>
  <div style="display:flex;flex:1;min-height:0;z-index:1">
    <div class="brk" style="flex:1;margin:16px;border:1px solid var(--ln);background:radial-gradient(ellipse at 50% 40%,#0b1118,#06080c 72%);position:relative;overflow:hidden">
      <svg viewBox="0 0 880 640" style="position:absolute;inset:0;width:100%;height:100%">
        <g stroke="rgba(125,205,255,.2)" stroke-width="1" fill="none">
          <path d="M150 200 L330 260 M330 260 L520 200 M520 200 L700 270 M330 260 L360 430 M360 430 L560 470 M560 470 L700 400 M700 270 L700 400 M150 200 L180 380 M180 380 L360 430"/>
        </g>
        <g stroke="rgba(62,224,160,.62)" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
          <path d="M330 260 L430 150 M560 470 L640 560"/>
        </g>
        <g stroke="rgba(240,178,61,.7)" stroke-width="1.8" fill="none">
          <path d="M520 200 L700 270"/>
        </g>
        <g font-family="IBM Plex Mono" font-size="10">
          <g><circle cx="150" cy="200" r="7" fill="#4dd8f0"/><text x="163" y="204" fill="#9fe9ff">V-1103A/B</text></g>
          <g><circle cx="330" cy="260" r="9" fill="none" stroke="#f0b23d" stroke-width="2.4"/><circle cx="330" cy="260" r="4" fill="#f0b23d"/><text x="345" y="264" fill="#f0b23d">C-1105A/B</text></g>
          <g><circle cx="520" cy="200" r="7" fill="#4dd8f0"/><text x="533" y="204" fill="#9fe9ff">MQ-1101</text></g>
          <g><circle cx="700" cy="270" r="7" fill="#4dd8f0"/><text x="713" y="274" fill="#9fe9ff">MY-1301</text></g>
          <g><circle cx="360" cy="430" r="7" fill="#4dd8f0"/><text x="373" y="434" fill="#9fe9ff">H-1104</text></g>
          <g><circle cx="560" cy="470" r="7" fill="#4dd8f0"/><text x="573" y="474" fill="#9fe9ff">V-1201</text></g>
          <g><circle cx="700" cy="400" r="7" fill="#4dd8f0"/><text x="713" y="404" fill="#9fe9ff">H-1106</text></g>
          <g><circle cx="180" cy="380" r="7" fill="#4dd8f0"/><text x="193" y="384" fill="#9fe9ff">V-1301</text></g>
          <g><circle cx="430" cy="150" r="6" fill="#3ee0a0"/><text x="442" y="154" fill="#3ee0a0">PC-1103</text></g>
          <g><circle cx="640" cy="560" r="6" fill="#3ee0a0"/><text x="652" y="564" fill="#3ee0a0">LC-1204</text></g>
        </g>
      </svg>
      <div style="position:absolute;left:12px;bottom:11px;display:flex;gap:6px">
        <sc-for list="{{legend}}" as="l" hint-placeholder-count="4">
          <div style="display:flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--ln);background:rgba(14,20,28,.9)">
            <div style="width:7px;height:7px;border-radius:50%;background:{{l.c}}"></div>
            <span class="mono" style="font-size:9.5px;color:var(--tx2)">{{l.n}}</span>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="width:340px;border-left:1px solid var(--ln);padding:16px;display:flex;flex-direction:column;gap:16px;flex:none">
      <div>
        <div class="lbl" style="margin-bottom:8px">Node · C-1105A/B</div>
        <div class="brk" style="border:1px solid var(--ln);background:var(--s1);padding:12px">
          <div class="mono" style="font-size:13px;color:var(--am);margin-bottom:8px">C-1105A/B</div>
          <sc-for list="{{kv}}" as="r" hint-placeholder-count="4">
            <div style="display:flex;justify-content:space-between;padding:3px 0;font-size:11px">
              <span style="color:var(--tx3)">{{r.k}}</span>
              <span class="mono" style="color:var(--tx)">{{r.v}}</span>
            </div>
          </sc-for>
        </div>
      </div>
      <div>
        <div class="lbl" style="margin-bottom:8px">Adjacent · 2</div>
        <sc-for list="{{adj}}" as="a" hint-placeholder-count="2">
          <div style="display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--ln);background:var(--s1);margin-bottom:6px">
            <div style="width:5px;height:5px;background:var(--cy)"></div>
            <span class="mono" style="font-size:11px;color:var(--tx)">{{a.t}}</span>
            <div style="flex:1"></div>
            <span style="font-size:10px;color:var(--tx3)">{{a.n}}</span>
          </div>
        </sc-for>
      </div>
      <div>
        <div class="lbl" style="margin-bottom:8px">Topology</div>
        <div style="border:1px solid var(--ln);background:var(--s1);padding:12px">
          <sc-for list="{{topo}}" as="r" hint-placeholder-count="3">
            <div style="display:flex;justify-content:space-between;padding:3px 0;font-size:11px">
              <span style="color:var(--tx3)">{{r.k}}</span>
              <span class="mono" style="color:var(--cy)">{{r.v}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() {
    return {
      legend: [
        { n: "EQUIPMENT", c: "#4dd8f0" }, { n: "SELECTED", c: "#f0b23d" },
        { n: "INSTRUMENT", c: "#3ee0a0" }, { n: "CONTROLS", c: "#3ee0a0" },
      ],
      kv: [
        { k: "type", v: "compressor" }, { k: "class", v: "equipment" },
        { k: "degree", v: "2" }, { k: "confidence", v: "1.00" },
      ],
      adj: [
        { t: "MQ-1101", n: "pig launcher" }, { t: "MY-1301", n: "process package" },
      ],
      topo: [
        { k: "mean degree", v: "2.14" }, { k: "isolated", v: "2" },
        { k: "components", v: "6" },
      ],
    };
  }
}
</script>
</body>
</html>
